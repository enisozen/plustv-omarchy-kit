<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a052e"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.75" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="#e30613" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#e30613" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.2" cy="0.8" r="0.55">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e30613"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow1)"/>
  <rect width="640" height="360" fill="url(#glow2)"/>
  <!-- Stadium & Cinema atmospheric rings -->
  <circle cx="520" cy="90" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="24"/>
  <circle cx="520" cy="90" r="130" fill="none" stroke="#e30613" stroke-opacity="0.18" stroke-width="8"/>
  <circle cx="520" cy="90" r="85" fill="none" stroke="#c084fc" stroke-opacity="0.22" stroke-width="4"/>
  <path d="M0 290 L640 210 L640 360 L0 360 Z" fill="#090214" fill-opacity="0.55"/>
  <!-- Digiturk Spiral + beIN Emblem -->
  <g transform="translate(52, 68)">
    <rect x="0" y="0" width="88" height="88" rx="22" fill="#e30613"/>
    <circle cx="44" cy="44" r="28" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="135 45"/>
    <circle cx="44" cy="44" r="14" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="60 30"/>
    <circle cx="44" cy="44" r="5" fill="#ffffff"/>
    <!-- Live pulse pill -->
    <rect x="106" y="12" width="142" height="30" rx="15" fill="#ffffff" fill-opacity="0.14"/>
    <circle cx="124" cy="27" r="5" fill="#ff2a4b"/>
    <text x="138" y="32" fill="#ffffff" font-family="Sans" font-weight="bold" font-size="13" letter-spacing="1.5">CANLI SPOR &amp; TV</text>
  </g>
  <!-- Main Brand Typography -->
  <text x="52" y="196" fill="#ffffff" font-family="Sans" font-weight="900" font-size="48" letter-spacing="1">beIN CONNECT</text>
  <text x="54" y="226" fill="#e9d5ff" font-family="Sans" font-weight="bold" font-size="18" letter-spacing="3">DIGITURK • SÜPER LİG • FİLM &amp; DİZİ</text>
  <rect x="52" y="244" width="240" height="6" rx="3" fill="url(#accentBar)"/>
</svg>
